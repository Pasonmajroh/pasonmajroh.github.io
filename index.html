<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pason Auto</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            Pason Auto
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Cars</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <button onclick="showMessage()">
            Explore Cars
        </button>

    </nav>


    <!-- Main Section -->
    <section class="hero">

        <div class="hero-text">

            <p class="small-title">
                PREMIUM AUTOMOTIVE
            </p>

            <h1>
                Drive Your
                <span>Dream.</span>
            </h1>

            <p class="description">
                Discover powerful, luxurious and modern cars
                designed for people who expect more.
            </p>

            <button class="main-button" onclick="showMessage()">
                Explore Cars
            </button>

        </div>


        <div class="car-card">

            <div class="car-info">

                <h2>
                    Mercedes-Benz
                </h2>

                <p>
                    AMG Performance
                </p>

            </div>

            <div class="car-image">
                🚘
            </div>

        </div>

    </section>


    <!-- Features -->
    <section class="features">

        <div class="feature">
            <h3>01</h3>
            <p>Powerful Engine</p>
        </div>

        <div class="feature">
            <h3>02</h3>
            <p>Luxury Interior</p>
        </div>

        <div class="feature">
            <h3>03</h3>
            <p>Modern Technology</p>
        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
